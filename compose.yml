services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: digitalbank
      POSTGRES_USER: digitalbank
      POSTGRES_PASSWORD: digitalbank
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digitalbank"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/digitalbank
    ports: ["8080:8080"]
