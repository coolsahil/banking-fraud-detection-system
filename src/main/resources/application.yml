spring:
  application:
    name: digitalbank-fraud-detection
  datasource:
    url: jdbc:h2:mem:digitalbank;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: true
  security:
    user:
      name: analyst
      password: change-me
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
springdoc:
  swagger-ui:
    path: /swagger-ui.html
